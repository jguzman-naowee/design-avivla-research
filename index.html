<!doctype html>
<html lang="es" data-capa="g">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brújula Ciudadana · Software para compartir programas</title>
<meta name="description" content="Una persona, todos sus programas, bajo su control. Software base para organizaciones y administraciones que comparten programas, beneficios o subsidios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Google Sans, self-hosted desde sdk-frontend-foundations/fonts/google-sans */
@font-face{font-family:'Google Sans';font-weight:100 400;src:url(assets/fonts/GoogleSans-Regular.ttf) format('truetype')}
@font-face{font-family:'Google Sans';font-weight:500;src:url(assets/fonts/GoogleSans-Medium.ttf) format('truetype')}
@font-face{font-family:'Google Sans';font-weight:600;src:url(assets/fonts/GoogleSans-SemiBold.ttf) format('truetype')}
@font-face{font-family:'Google Sans';font-weight:700 900;src:url(assets/fonts/GoogleSans-Bold.ttf) format('truetype')}
:root{
  /* Naowee modo oscuro (tokens --naotech-dark-*): fondo azul #0b1e36, azul #006aff, naranja de marca #ff7500, Inter */
  --bg:#0b1e36;--bg2:#00204a;--ink:#e9f8ff;--muted:#a3b8d4;--accent:#006aff;--accent-t:#26bcff;--accent2:#ff7500;
  --card:#0a2a54;--line:#0d417d;--ok:#6cd56e;--warn:#ddc44b;--bad:#fe94a3;--on-accent:#ffffff;
  --head:'Google Sans',Inter,system-ui,sans-serif;--base:'Google Sans',Inter,system-ui,sans-serif;--r:18px;--sh:rgba(0,10,30,.6);--code:#00152b;
}
[data-capa="a"]{
  --bg:#F4F0E6;--bg2:#E8DFC8;--ink:#3B2A1A;--muted:#7A6E5F;--accent:#4A5240;--accent2:#C4922A;
  --card:#FDFAF4;--line:#D8CDB0;--ok:#3B6B3A;--warn:#C4922A;--bad:#A63228;--on-accent:#FDFAF4;
  --accent-t:#4A5240;--base:Inter,system-ui,sans-serif;--head:'Playfair Display',Georgia,serif;--sh:rgba(59,42,26,.28);--code:#2b1f14;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--base);
  transition:background .7s ease,color .7s ease;overflow-x:hidden}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
[data-capa="a"] h1,[data-capa="a"] h2,[data-capa="a"] h3{letter-spacing:-.01em}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
[data-i]{transition:opacity .25s ease}
.swap [data-i]{opacity:0}

/* barra de progreso y navegación */
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent2);z-index:60}
nav.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);transition:background .7s}
.brand{font:700 20px var(--head);display:flex;align-items:center;gap:10px;text-decoration:none}
.brand i{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);position:relative;display:inline-block}
.brand i::after{content:"";position:absolute;left:50%;top:50%;width:2px;height:12px;background:var(--accent2);
  transform:translate(-50%,-50%) rotate(35deg);border-radius:2px}
nav.top .links{display:flex;gap:22px;font-size:14px;color:var(--muted)}
nav.top .links a{text-decoration:none}nav.top .links a:hover{color:var(--ink)}
.sw{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px;position:relative}
.sw button{all:unset;cursor:pointer;padding:6px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.sw button[aria-pressed=true]{color:var(--on-accent)}
.sw .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--accent);border-radius:99px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
[data-capa="a"] .sw .pill{transform:translateX(100%)}
.sw button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
@media(max-width:820px){nav.top .links{display:none}}


.brand .lg{display:flex;align-items:center;gap:10px}
.brand .lg b{font:700 17px var(--head);white-space:nowrap}
.brand .lg-g em{width:1px;height:20px;background:var(--line);display:block}
.brand .lg-a{display:none}
.brand .lg-a b{font:700 22px var(--head);letter-spacing:.04em}
.brand .lg-a small{font-size:11px;color:var(--muted);align-self:flex-end;margin-bottom:3px}
[data-capa="a"] .brand .lg-g{display:none}[data-capa="a"] .brand .lg-a{display:flex}
@media(max-width:560px){.brand .lg-g b,.brand .lg-a small{display:none}}

/* hero: escena fija mientras se anima el scroll */
#hero{height:230vh;position:relative}
#hero .stick{position:sticky;top:0;height:100vh;display:flex;align-items:center;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hero .txt{position:relative;z-index:2;max-width:760px;padding:0 20px;margin:0 auto 0 max(20px,calc((100vw - 1120px)/2 + 20px))}
#hero h1{font-size:clamp(40px,7vw,84px);margin:14px 0 20px}
#hero p.lead{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:600px;margin:0 0 28px}
.btn{display:inline-block;font-family:var(--base);background:var(--accent);color:var(--on-accent);padding:14px 26px;border-radius:99px;font-weight:600;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:10px}
.scrollcue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);z-index:2;transition:opacity .4s}

/* problema: tres frases que se encienden con el scroll */
#problema{height:300vh;position:relative}
#problema .stick{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
#problema .lines{max-width:900px;padding:0 20px}
#problema .ln{font:600 clamp(28px,5vw,56px)/1.15 var(--head);opacity:.12;transform:translateY(14px);transition:opacity .5s,transform .5s;margin:0 0 18px}
#problema .ln.on{opacity:1;transform:none}
#problema .ln.last.on{color:var(--accent2)}
#problema .eyebrow{display:block;margin-bottom:26px}
.dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dots b{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:.18;transition:transform .2s linear}

/* historia con panel fijo */
#como{padding:90px 0}
#como h2{font-size:clamp(32px,5vw,56px);margin:10px 0 50px;max-width:780px}
.story{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.steps .st{min-height:78vh;display:flex;flex-direction:column;justify-content:center;opacity:.28;transition:opacity .5s,transform .5s;transform:translateX(-8px)}
.steps .st.on{opacity:1;transform:none}
.steps .st.first{min-height:340vh;justify-content:flex-start}
.steps .st.first .stin{position:sticky;top:calc(50vh - 70px)}
.steps .n{font:700 14px var(--head);color:var(--accent2);margin-bottom:10px}
.steps h3{font-size:clamp(26px,3.4vw,40px);margin-bottom:12px}
.steps p{color:var(--muted);margin:0;max-width:440px}
.panel{--ph:min(560px,calc(100vh - 170px));position:sticky;top:calc(50vh - var(--ph)/2);height:var(--ph);background:var(--card);border:1px solid var(--line);
  border-radius:24px;box-shadow:0 30px 80px -30px var(--sh);overflow:hidden;transition:background .7s}
.panel .bar{display:flex;gap:6px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel .bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.panel .ex{position:absolute;bottom:12px;right:18px;font-size:11px;color:var(--muted)}
.scene{position:absolute;inset:44px 0 0;padding:26px;opacity:0;transform:translateY(24px) scale(.98);transition:opacity .55s,transform .55s;pointer-events:none}
.scene.on{opacity:1;transform:none}
.who{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.av{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 20px var(--head)}
.who b{display:block;font-size:18px}.who span{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.tag{font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px;background:var(--bg2);color:var(--ink);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 24%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.row>span:first-child{min-width:96px}
.meter{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;flex:1;max-width:190px}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.scene.on .meter i{width:var(--w)}
.pct{font-size:12px;color:var(--muted)}
.flow{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.state{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;opacity:.35;transition:all .5s}
.state .dot{width:12px;height:12px;border-radius:50%;background:var(--line);transition:background .5s}
.scene.on .state:nth-child(1){opacity:1;transition-delay:.2s}
.scene.on .state:nth-child(2){opacity:1;transition-delay:1.1s;border-color:var(--ok)}
.scene.on .state:nth-child(1) .dot{background:var(--warn);transition-delay:.2s}
.scene.on .state:nth-child(2) .dot{background:var(--ok);transition-delay:1.1s}
.state small{margin-left:auto;color:var(--muted);font-size:12px}
.mini{font-size:13px;color:var(--muted);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.07em}
@media(max-width:860px){
  .story{grid-template-columns:1fr}
  .panel{--ph:330px;top:76px;z-index:5}
  .scene{padding:16px}
  .steps .st{min-height:62vh}
}


/* sin duplicados */
#unico{height:560vh;position:relative}
#unico .stick{position:sticky;top:0;height:100vh;display:flex;align-items:center}
#unico .g{display:grid;grid-template-columns:.9fr 1.3fr;gap:44px;align-items:center;width:100%}
#unico h2{font-size:clamp(26px,3vw,38px);margin:10px 0 22px;text-wrap:balance}
.cap{min-height:170px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;color:var(--ink)}
:root:not([data-capa="a"]) .cap{--card:#fff;--ink:#282834;--muted:#646587;--line:#e7e9f3}
.cap .ph{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:99px;margin-bottom:10px}
.cap.typing{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.cap h3 .cur,.cap p .cur{display:inline-block;width:2px;height:.9em;background:var(--accent);margin-left:2px;vertical-align:-.1em;animation:blink 1s steps(2) infinite}
.cap h3{font-size:clamp(22px,2.6vw,30px);margin-bottom:8px}.cap p{margin:0;color:var(--muted);max-width:460px;font-size:16px}
.stage{min-height:470px;display:flex;flex-direction:column;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 80px -30px var(--sh);transition:background .7s}
.clock{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.clock b{font:700 18px var(--head);color:var(--ink)}
.track{position:relative;height:46px;margin-bottom:4px}
.tok{position:absolute;top:2px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 16px var(--head);
  left:calc(16.6% - 21px);transition:left .8s cubic-bezier(.2,.8,.2,1),opacity .4s;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.stage[data-ph="1"] .tok{left:calc(50% - 21px)}.stage[data-ph="2"] .tok{left:calc(83.3% - 21px)}.stage[data-ph="3"] .tok{left:calc(50% - 21px)}.stage[data-ph="4"] .tok{opacity:0}
.orgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.oc{border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px;transition:border-color .4s,background .4s}
.oc h4{margin:0 0 2px;font:600 14px var(--base)}.oc small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.res{margin-top:10px;font-size:12px;font-weight:600;padding:6px 9px;border-radius:10px;display:none;line-height:1.35}
.res.on{display:block;animation:pop .45s}
.res.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.res.no{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.res.past{background:var(--bg2);color:var(--muted)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.led{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.led .mini{margin:0 0 4px}
.led .li{display:flex;gap:8px;font-size:12.5px;padding:5px 0;opacity:0;transform:translateX(14px);transition:all .5s}
.led .li.on{opacity:1;transform:none}
.led .li i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}
.led .li.no i{background:var(--bad)}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;opacity:0;transition:opacity .6s}
.rules{opacity:1}
.rules span{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-t)}
@media(max-width:900px){
  #unico .g{grid-template-columns:1fr;gap:16px}.cap{min-height:128px}
  .oc{padding:8px;min-height:104px}.res{font-size:11px}
  #unico h2{font-size:26px;margin-bottom:8px}
}


/* interfaces claras (blancas) en el genérico */
:root:not([data-capa="a"]) .panel,:root:not([data-capa="a"]) .stage,:root:not([data-capa="a"]) .log,:root:not([data-capa="a"]) .ui{
  --card:#ffffff;--ink:#282834;--muted:#646587;--line:#e7e9f3;--bg2:#f4f5f9;--ok:#1f8923;--warn:#a48700;--bad:#d3032a;--accent:#006aff;--accent-t:#006aff;--sh:rgba(0,10,30,.55);
  color:var(--ink)}
.scene{display:flex;flex-direction:column;justify-content:center}
#programa{padding:100px 0}
#programa .pg{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}
#programa h2{font-size:clamp(34px,5.4vw,64px);margin:12px 0 20px}
#programa p.lead{color:var(--muted);max-width:470px;margin:0}
.ui{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 30px 80px -30px var(--sh);color:var(--ink);transition:background .7s}
.ui .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ui .hd b{font:700 19px var(--head)}
.ui .hd small{color:var(--muted);margin-left:auto;font-size:12px}
.rowx{margin:8px 0;border:1.5px solid var(--accent);border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ui .rowx .row{border-bottom:0;padding:14px 16px}
.start{padding:12px 16px 14px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-top:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);font-size:14.5px}
.start b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
@media(max-width:900px){#programa .pg{grid-template-columns:1fr;gap:28px}}


/* look de app: títulos y jerarquía dentro de las interfaces */
.scene .mini,.ui .mini,.log .mini,.stage .mini{font:600 15px/1.2 var(--base);letter-spacing:0;text-transform:none;color:var(--ink);margin:24px 0 4px;display:flex;align-items:center;gap:9px}
.scene .mini::before,.ui .mini::before,.log .mini::before,.stage .mini::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--accent)}
.scene>.mini:first-child,.log>.mini:first-child{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.scene>.mini:first-child::before,.log>.mini:first-child::before{display:none}
.scene .row,.ui .row{font-weight:500;font-size:15.5px;padding:15px 0}
.scene .row .pct,.ui .row .pct,.log .li span{font-weight:400}
.ui .row .pct{font-size:14.5px;font-weight:500;color:var(--ink);opacity:.8}
.tag{font-size:12.5px;padding:4px 12px}
.ui .hd b{font-size:22px;letter-spacing:-.02em}
.log .li{font-size:14.5px;padding:14px 0}


/* ===== panel como app ===== */
.scene.reg{overflow:hidden}
.scene.reg>.rh,.scene.reg>.fld,.scene.reg>.cb,.scene.reg>.helper,.scene.reg>.cta{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
.scene.reg.flip>.rh,.scene.reg.flip>.fld,.scene.reg.flip>.cb,.scene.reg.flip>.helper,.scene.reg.flip>.cta{transform:translateX(-40px);opacity:0}
.chk{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;gap:10px;background:var(--bg2);transform:translateX(100%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.scene.reg.flip .chk{transform:none}

/* registro: formulario que se llena solo; sin cabecera ni tab bar hasta tener cuenta */
.panel.app[data-s="0"] .ah,.panel.app[data-s="0"] .tabs{display:none}
.panel.app[data-s="0"] .sb{background:var(--bg2);color:var(--ink)}
.panel.app[data-s="0"] .sb .ic i,.panel.app[data-s="0"] .sb .ic b::after{background:var(--ink)}.panel.app[data-s="0"] .sb .ic b{border-color:var(--ink)}
.scene.reg{padding:22px 22px 18px;gap:10px;background:var(--bg2)}
.rh b{display:block;font:700 24px var(--head);letter-spacing:-.02em}.rh small{color:var(--muted);font-size:13px}
.fld{display:flex;flex-direction:column;gap:4px;opacity:.45;transition:opacity .3s}
.fld.on,.fld.done{opacity:1}
.fld label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld .in{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;min-height:44px;display:flex;align-items:center;transition:border-color .3s}
.fld.on .in{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.fld .cur{width:2px;height:18px;background:var(--accent);margin-left:2px;opacity:0}
.fld.on .cur{opacity:1;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.cb{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);transition:color .3s}
.cb i{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent;font-style:normal;font-weight:700;font-size:13px;transition:all .3s}
.cb i::before{content:"✓"}
.cb.on{color:var(--ink)}.cb.on i{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.08)}
.helper{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);opacity:0;transition:opacity .4s}
.helper.on{opacity:1}
.helper i{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 12px var(--base);font-style:normal}
.cta{margin-top:auto;background:var(--accent);color:#fff;border-radius:14px;padding:14px;text-align:center;font-weight:600;font-size:15px;opacity:.5;position:relative;overflow:hidden;transition:opacity .3s,background .4s,transform .15s}
.cta.ready{opacity:1}.cta.press{transform:scale(.97)}
.cta.done{background:var(--ok)}
.cta .b{display:none}.cta.done .a{display:none}.cta.done .b{display:inline}
